onboarding = false

[theme]
name = "dracula"
auto_switch = false

[ui]
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[terminal]
new_cwd = "~/dev/sandbox"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "herdr pane move \"$HERDR_PANE_ID\" --new-tab --focus"
description = "break pane into tab"
