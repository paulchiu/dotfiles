# tuicr config. Reference: https://github.com/agavra/tuicr/blob/v0.23.1/docs/CONFIG.md
#
# tuicr renders diffs in-process (syntect + two-face, the same grammar corpus bat
# and delta use). It has no external diff-engine hook and passes --no-ext-diff on
# every git call, so delta cannot be plugged in here. delta stays configured in
# ~/.gitconfig and still handles plain git diff/show/log -p. The settings below
# mirror the delta setup rather than delegating to it.

appearance = "dark"          # [delta] dark = true
diff_view = "side-by-side"   # [delta] side-by-side = true

username = "Paul Chiu"       # author stamped on locally authored comments

# Drop the PR conversation timeline, for an unbiased first pass.
# Narrower than the name suggests: it only removes the `comments` field from
# `gh pr view --json`. Inline review threads (CodeRabbit et al) come from a
# separate ungated GraphQL call, so they still appear in the diff and the yank.
# Hide those per session with `:comments hide`; nothing keeps them out of the yank.
show_pr_comments = false

# Yank/:clip export: comment lines only, no preamble or headings.
[export]
intro = ""
scope_line = false
pr_metadata = false
comments_header = ""
legend = false
remote_comments_header = "## Existing GitHub Comments"   # keep: review threads still export, better labelled than loose
